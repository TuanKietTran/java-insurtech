spring:
  application:
    name: commissions-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurtech?currentSchema=commissions}
    username: ${DB_USER:commissions_svc}
    password: ${DB_PASSWORD:commissions_svc}
  flyway:
    schemas: commissions
    default-schema: commissions
    locations: classpath:db/migration/commissions
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8141}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
