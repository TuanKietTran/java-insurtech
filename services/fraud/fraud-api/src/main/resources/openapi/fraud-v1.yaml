openapi: 3.1.0
info:
  title: Fraud, Sanctions & AML API
  version: 1.0.0
  description: |
    Published contract of the `fraud` bounded context (R03).

    - Contract-first (CRC-API-001); URI-versioned (CRC-API-002).
    - Lifecycle changes are command resources such as `POST /v1/<resource>/{id}/close` (CRC-API-004).
    - Mutating operations require `Idempotency-Key` (CRC-IDEM-001) and `If-Match` on aggregates (CRC-SM-009).
    - Errors are RFC 9457 Problem Details (CRC-API-003); money is a string amount plus currency (CRC-MON-008).
servers:
  - url: http://localhost:8172
paths: {}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?\d+(\.\d+)?$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    Problem:
      type: object
      required: [type, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        reasons:
          type: array
          items:
            type: string
