spring:
  application:
    name: fnol-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurtech?currentSchema=fnol}
    username: ${DB_USER:fnol_svc}
    password: ${DB_PASSWORD:fnol_svc}
  flyway:
    schemas: fnol
    default-schema: fnol
    locations: classpath:db/migration/fnol
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8120}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
