spring:
  application:
    name: policy-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurtech?currentSchema=policy}
    username: ${DB_USER:policy_svc}
    password: ${DB_PASSWORD:policy_svc}
  flyway:
    schemas: policy
    default-schema: policy
    locations: classpath:db/migration/policy
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8111}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
