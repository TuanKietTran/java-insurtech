spring:
  application:
    name: vendors-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurtech?currentSchema=vendors}
    username: ${DB_USER:vendors_svc}
    password: ${DB_PASSWORD:vendors_svc}
  flyway:
    schemas: vendors
    default-schema: vendors
    locations: classpath:db/migration/vendors
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8150}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
