spring:
  application:
    name: claims-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurtech?currentSchema=claims}
    username: ${DB_USER:claims_svc}
    password: ${DB_PASSWORD:claims_svc}
  flyway:
    schemas: claims
    default-schema: claims
    locations: classpath:db/migration/claims
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8121}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
