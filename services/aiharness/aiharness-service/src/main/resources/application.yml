spring:
  application:
    name: aiharness-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurtech?currentSchema=aiharness}
    username: ${DB_USER:aiharness_svc}
    password: ${DB_PASSWORD:aiharness_svc}
  flyway:
    schemas: aiharness
    default-schema: aiharness
    locations: classpath:db/migration/aiharness
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8106}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
