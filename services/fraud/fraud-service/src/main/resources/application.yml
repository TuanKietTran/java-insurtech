spring:
  application:
    name: fraud-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurtech?currentSchema=fraud}
    username: ${DB_USER:fraud_svc}
    password: ${DB_PASSWORD:fraud_svc}
  flyway:
    schemas: fraud
    default-schema: fraud
    locations: classpath:db/migration/fraud
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8172}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
