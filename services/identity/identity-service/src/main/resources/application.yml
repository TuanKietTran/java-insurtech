spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurtech?currentSchema=identity}
    username: ${DB_USER:identity_svc}
    password: ${DB_PASSWORD:identity_svc}
  flyway:
    schemas: identity
    default-schema: identity
    locations: classpath:db/migration/identity
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8101}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
