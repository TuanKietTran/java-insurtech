spring:
  application:
    name: rating-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurtech?currentSchema=rating}
    username: ${DB_USER:rating_svc}
    password: ${DB_PASSWORD:rating_svc}
  flyway:
    schemas: rating
    default-schema: rating
    locations: classpath:db/migration/rating
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8112}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
