spring:
  application:
    name: ledger-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurtech?currentSchema=ledger}
    username: ${DB_USER:ledger_svc}
    password: ${DB_PASSWORD:ledger_svc}
  flyway:
    schemas: ledger
    default-schema: ledger
    locations: classpath:db/migration/ledger
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8103}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
